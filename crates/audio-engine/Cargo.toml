[package]
name = "audio-engine"
description = "Low-latency Windows audio engine with WASAPI capture, render, and spatial audio support"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
biquad-dsp = { path = "../biquad-dsp" }
autoeq-parser = { path = "../autoeq-parser" }

windows = { version = "0.61", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
rtrb = "0.3"
atomic_float = "1"
crossbeam-utils = "0.8"
serde = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
parking_lot = "0.12"
